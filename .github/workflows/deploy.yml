# main에 올리면: 코드 문법·스테이지 점검 → dist 만들기 → Cloudflare에 배포
# 처음 한 번 저장소 Settings → Secrets and variables → Actions 에 CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID 를 넣어야 배포까지 감 (없으면 점검만)
# 잠시 닫기: 저장소 맨 위에 MAINTENANCE 파일을 두면 점검 화면(maintenance/)만 올라감. 파일을 지우면 다음 배포에서 게임이 돌아옴
# 유료 이펙트 원본(assets/king)은 저장소에 없어서, 지금 사이트에 올라가 있는 뒤섞은 팩(js/king-pack.js)을 받아서 그대로 다시 올림
name: 배포
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 코드 문법 검사
        run: for f in js/*.js tools/*.js tools/stages/*.js; do node --check "$f"; done
      - name: 스테이지 점검 (판 크기·목표·그림 파일·대사)
        run: node tools/stages/check.js
      - name: 출처 점검 (assets의 그림·소리가 모두 js/credits.js에 적혀 있는지)
        run: node tools/credits.js --check
      - name: dist 만들기
        run: python3 tools/build_dist.py
      - name: 유료 이펙트 팩은 지금 사이트에 있는 걸 그대로
        run: curl -fsSL https://chiikawa.3match.workers.dev/js/king-pack.js -o dist/js/king-pack.js && echo "이펙트 팩 $(wc -c < dist/js/king-pack.js) 바이트" || echo "이펙트 팩이 없어서 무료 이펙트로 배포"
      - name: 점검 중이면 점검 화면만 (저장소 맨 위에 MAINTENANCE 파일이 있을 때)
        run: |
          if [ -f MAINTENANCE ]; then
            mv dist/js/king-pack.js /tmp/ 2>/dev/null || true
            rm -rf dist && cp -r maintenance dist && mkdir -p dist/js
            mv /tmp/king-pack.js dist/js/ 2>/dev/null || true # 다시 열 때 이 사이트에서 받아 가야 해서 남겨 둠
            echo "점검 화면으로 배포: $(ls dist)"
          fi
      - name: Cloudflare에 배포
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4' # 기본으로 깔리는 3.90은 wrangler.jsonc(그림만 올리는 설정)를 못 읽음
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 배포 건너뜀 안내
        if: env.CF_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN이 없어서 점검만 했어요 (README '자동 배포' 참고)"
