<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>먼작귀 퍼즐 토벌 대작전! (팬게임)</title>
<meta name="description" content="치이카와·하치와레·우사기와 함께하는 3매치 퍼즐! 일상 퍼즐, 괴물 토벌, 친구 모으기까지. 무료 비공식 팬게임">
<!-- 링크 공유 미리보기 (카톡·트위터 등) -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://chiikawa.3match.workers.dev/">
<meta property="og:title" content="먼작귀 퍼즐 토벌 대작전!">
<meta property="og:description" content="치이카와·하치와레·우사기와 함께하는 3매치 퍼즐! 일상 퍼즐, 괴물 토벌, 친구 모으기까지. 무료 비공식 팬게임">
<meta property="og:image" content="https://chiikawa.3match.workers.dev/assets/img/app/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffd6e6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="퍼즐 토벌">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="assets/img/app/apple-touch-icon.png?v=2">
<link rel="icon" href="assets/img/app/icon-192.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poor+Story&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=107">
</head>
<body>
<div id="app">

  <section id="title" class="screen active">
    <div class="title-sky">
      <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
      <div class="logo"><h1><img src="assets/img/ui/logo.png" alt="퍼즐 토벌 대작전!"></h1></div>
      <div class="petals"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="hill"><div id="titleParty" class="title-party"></div></div>
      <div class="title-foot">
        <button id="btnStart" class="big-btn">시작하기</button>
        <button id="btnTitleLogin" class="title-login" hidden></button>
        <p class="credit">비공식 팬게임 · 캐릭터 © nagano / chiikawa committee</p>
      </div>
    </div>
  </section>

  <section id="map" class="screen">
    <header class="bar">
      <button class="icon-btn" id="btnMapHome">⌂</button>
      <button class="icon-btn" id="btnMapRank" aria-label="랭킹"><img loading="lazy" src="assets/img/items/medal.png?v=2" alt=""></button>
      <div class="bar-title" id="mapTitle">모험 지도</div>
      <div class="hearts"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.2 0 3.6 1.2 4.4 2.5.8-1.3 2.2-2.5 4.4-2.5 3.8 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg><b>5</b><small>MAX</small></div>
      <div class="coins"><img loading="lazy" src="assets/img/items/coin.png?v=2" alt=""><b>0</b></div>
      <button class="icon-btn btn-set" aria-label="설정">⚙</button>
    </header>
    <div class="map-pager"><button id="mapPrev" aria-label="이전 지역">◀</button><div><b id="mapRegion"></b><small id="mapRange"></small></div><button id="mapNext" aria-label="다음 지역">▶</button></div>
    <div id="mapScroll"><div id="mapPath"></div></div>
    <button id="btnProfile" aria-label="프로필"></button>
    <button id="btnMission" aria-label="오늘의 미션"><img loading="lazy" src="assets/img/items/medal.png?v=2" alt=""><span>미션</span><i></i></button>
    <button id="btnNotice" aria-label="공지사항"><img loading="lazy" src="assets/img/items/star.png?v=2" alt=""><span>공지</span><i></i></button>
    <nav class="dock">
      <button id="btnHouse"><img loading="lazy" src="assets/img/items/house.png?v=2" alt=""><span>집</span></button>
      <button id="btnGacha"><img loading="lazy" src="assets/img/items/gift.png?v=2" alt=""><span>가게</span></button>
      <button id="btnFriends"><img loading="lazy" src="assets/img/faces/chiikawa.png" alt=""><span>친구들</span></button>
      <button id="btnChallenge"><img loading="lazy" src="assets/img/items/medal.png?v=2" alt=""><span>도전</span></button>
      <button id="btnRamen" class="ramen-btn"><img loading="lazy" src="assets/img/npc/armor.png" alt=""><span>라면 가게</span><i class="dot"></i></button>
    </nav>
  </section>

  <section id="house" class="screen">
    <header class="bar">
      <button class="icon-btn btn-tomap">◀</button>
      <div class="bar-title" id="houseTitle">친구네 집</div>
      <div class="coins"><img loading="lazy" src="assets/img/items/coin.png?v=2" alt=""><b>0</b></div>
    </header>
    <div id="homeTabs"></div>
    <div id="affBar"></div>
    <div id="room"><div class="wall"></div><div class="floor"></div><button id="btnDeco" class="mini-btn">꾸미기</button><button id="cozy"></button><button id="btnMates" class="mini-btn">같이 살 친구</button><button id="btnFeed" class="mini-btn">간식 주기</button></div>
    <div class="shop-wrap"><div class="shop-tabs"><button data-t="furn" class="on">가구</button><button data-t="wall">벽지</button><button data-t="floor">바닥</button></div><div id="shop"></div></div>
  </section>

  <section id="ramen" class="screen">
    <header class="bar">
      <button class="icon-btn btn-tomap">◀</button>
      <div class="bar-title">라멘 가게</div>
      <div class="coins"><img loading="lazy" src="assets/img/items/coin.png?v=2" alt=""><b>0</b></div>
    </header>
    <div id="shopScene">
      <div class="noren"><span>라</span><span>멘</span></div>
      <div class="shelf"><img loading="lazy" src="assets/img/items/naruto.png?v=2" alt=""><img loading="lazy" src="assets/img/items/egg.png?v=2" alt=""><img loading="lazy" src="assets/img/items/pot.png?v=2" alt=""></div>
      <button id="shopMaster"><img loading="lazy" src="assets/img/art/armor_one.png" alt="" draggable="false"></button>
      <button id="shopShisa"><img loading="lazy" src="assets/img/art/pose_shisa.png" alt="" draggable="false"></button>
      <div class="counter"></div>
      <div id="shopSay"></div>
    </div>
    <div id="ramenMenu">
      <div class="rm-tabs"><button data-t="ramen" class="on">라멘</button><button data-t="train">수련</button><button data-t="items">포장</button></div>
      <div class="rm-paper"><h4 id="ramenTitle">차림표</h4><div class="rm-btns"></div><p id="ramenNote"></p></div>
    </div>
  </section>

  <section id="gacha" class="screen">
    <header class="bar">
      <button class="icon-btn btn-tomap">◀</button>
      <div class="bar-title">가게</div>
      <div class="coins"><img loading="lazy" src="assets/img/items/coin.png?v=2" alt=""><b>0</b></div>
    </header>
    <div class="gacha-body">
      <div class="gacha-tabs"><button data-g="friend" class="on">캡슐 뽑기</button><button data-g="outfit">옷 가게</button></div>
      <div id="gachaMachine"><img loading="lazy" src="assets/img/gacha/machine.webp" alt="" draggable="false"><div id="gachaKnob"><i></i></div></div>
      <p id="gachaNote" class="gacha-note"></p>
      <div class="gacha-btns">
        <button id="btnPull" class="big-btn ghost"><img loading="lazy" src="assets/img/items/coin.png?v=2" alt="">100 · 1번</button>
        <button id="btnPull10" class="big-btn"><img loading="lazy" src="assets/img/items/coin.png?v=2" alt="">900 · 10번</button>
      </div>
      <button id="gachaWish" class="gacha-wish"></button>
      <div id="gachaStage"></div>
    </div>
  </section>

  <section id="challenge" class="screen">
    <header class="bar">
      <button class="icon-btn btn-tomap">◀</button>
      <div class="bar-title">도전</div>
      <div class="coins"><img loading="lazy" src="assets/img/items/coin.png?v=2" alt=""><b>0</b></div>
    </header>
    <div class="ch-body">
      <button id="btnLeague" class="ch-card league"><div class="ch-label"><b>주간 리그</b><small id="lgTwist"></small><span id="lgState"></span></div></button>
      <button id="btnDayChal" class="ch-card daily"><div class="ch-label"><b>오늘의 도전</b><small id="dayTwist"></small><span id="dayState"></span></div></button>
      <button id="btnTower" class="ch-card tower"><div class="ch-label"><b>인어섬 탐험</b><small>끝없이 올라가는 층</small><span id="towerBest"></span></div></button>
      <button id="btnContest" class="ch-card contest"><div class="ch-label"><b>제초 대회</b><small>60초 동안 최고 점수</small><span id="contestBest"></span></div></button>
      <button id="btnDungeon" class="ch-card dungeon"><img loading="lazy" class="ch-mimic" src="assets/img/monsters/mimic.webp" alt=""><img loading="lazy" class="ch-peek" src="assets/img/art/pose_hachiware.png" alt=""><div class="ch-label"><b>미믹 보물창고</b><small>상자를 깨서 코인 벌기</small><span id="dunLeft"></span></div></button>
      <button id="btnSnack" class="ch-card snack"><img loading="lazy" class="ch-peek" src="assets/img/art/pose_kurimanju.png" alt=""><div class="ch-label"><b>간식 창고</b><small>상자를 깨서 간식 모으기</small><div id="snackPick"></div><span id="snackLeft"></span></div></button>
    </div>
  </section>

  <section id="ranking" class="screen">
    <header class="bar">
      <button class="icon-btn btn-tomap">◀</button>
      <div class="bar-title">랭킹</div>
      <div style="width:40px"></div>
    </header>
    <div class="rank-tabs"><button data-t="cleared">스테이지</button><button data-t="tower">인어섬</button><button data-t="contest">제초 대회</button></div>
    <div id="rankMe"></div>
    <ol id="rankList"></ol>
  </section>

  <section id="friends" class="screen">
    <header class="bar">
      <button class="icon-btn btn-tomap">◀</button>
      <div class="bar-title">친구들<small id="friendsCount"></small></div>
      <div class="coins"><img loading="lazy" src="assets/img/items/coin.png?v=2" alt=""><b>0</b></div>
    </header>
    <div id="friendsGrid"></div>
  </section>

  <section id="formation" class="screen">
    <header class="bar">
      <button class="icon-btn" id="btnFormBack">◀</button>
      <div class="bar-title">토벌대 편성<small id="formStage"></small></div>
      <button class="icon-btn btn-set" aria-label="설정">⚙</button>
    </header>
    <div class="form-body">
      <div class="form-card">
        <div class="form-label">상대</div>
        <div id="formEnemies" class="form-enemies"></div>
        <div class="attr-rule"></div>
      </div>
      <div class="form-card">
        <div class="form-label">출격 <span id="formCount"></span><button id="btnAuto" class="mini-btn">자동 편성</button></div>
        <div id="formSlots" class="form-slots"></div>
      </div>
      <div id="formRoster" class="form-roster"></div>
    </div>
    <div class="form-foot"><button id="btnFormMap" class="big-btn ghost"><img loading="lazy" class="b-ic" src="assets/img/ui/back.png" alt="">지도</button><button id="btnSortie" class="big-btn">출격!</button></div>
  </section>

  <section id="battle" class="screen">
    <header class="bar">
      <button class="icon-btn" id="btnBack" aria-label="일시정지"><svg viewBox="0 0 24 24" width="18" height="18"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg></button>
      <div class="bar-title"><span id="stageName"></span><small id="waveInfo"></small></div>
      <button class="icon-btn btn-set" aria-label="설정">⚙</button>
    </header>
    <div id="arena">
      <div id="feverTag">응원 피버! ×1.5</div>
      <div id="monsterWrap">
        <div id="monName"></div>
        <div id="monHp" class="hp"><div class="fill"></div><span></span></div>
        <div id="monSprite"><img loading="lazy" id="monster" alt=""></div>
        <div id="countdown"></div>
      </div>
    </div>
    <div id="team">
      <div id="party"></div>
      <div id="teamRow"><svg class="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.2 0 3.6 1.2 4.4 2.5.8-1.3 2.2-2.5 4.4-2.5 3.8 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z" fill="#ff6b8a" stroke="#4a4262" stroke-width="2" stroke-linejoin="round"/></svg><div id="teamHp" class="hp"><div class="fill"></div><span></span></div><button class="btn-auto">AUTO</button></div>
    </div>
    <div id="lifeHud">
      <div class="lh-card lh-limit"><span id="lhLimitLabel"></span><b id="lhLimit">0</b></div>
      <div class="lh-card lh-goals"><div id="lhGoals"></div></div>
      <div class="lh-help"><div id="lhHelper" class="pm"><i class="glow"></i><div class="pm-face"></div><i class="g"><b></b></i></div><button class="btn-auto">AUTO</button></div>
    </div>
    <div id="lhScore"><div class="bar"><div class="fill"></div><i></i><i></i><i></i></div><b>0</b></div>
    <div id="boardWrap"><div id="board"></div></div>
  </section>

  <div id="story" class="overlay">
    <div class="story-box">
      <img loading="lazy" id="storyChar" alt="">
      <div class="story-text">
        <div id="storyName"></div>
        <div id="storyLine"></div>
        <div class="story-next">▼</div>
      </div>
    </div>
  </div>

  <div id="mission" class="overlay">
    <div class="modal-card mis-card">
      <h2>오늘의 미션</h2>
      <div class="mis-list"></div>
      <div class="att-line"></div>
      <div class="modal-btns"><button data-close class="big-btn">닫기</button></div>
    </div>
  </div>

  <div id="attend" class="overlay">
    <div class="modal-card att-card">
      <img loading="lazy" class="att-hero" src="assets/img/art/pose_hachiware.png" alt="">
      <h2>출석 도장</h2>
      <p class="att-sub">하루에 한 칸! 7일째엔 뽑기 티켓</p>
      <div class="att-grid"></div>
      <div class="modal-btns"><button data-close class="big-btn">고마워!</button></div>
    </div>
  </div>

  <div id="pause" class="overlay">
    <div class="modal-card pause-card">
      <h2>일시정지</h2>
      <p class="p-warn"></p>
      <button data-p="settings" class="big-btn ghost p-set"><img loading="lazy" class="b-ic" src="assets/img/ui/gear.png" alt="">설정</button>
      <div class="modal-btns">
        <button data-p="quit" class="big-btn ghost">나가기</button>
        <button data-p="resume" class="big-btn">계속하기</button>
      </div>
    </div>
  </div>

  <div id="settings" class="overlay">
    <div class="modal-card pause-card">
      <h2>설정</h2>
      <label class="set-row"><span>효과음</span><input type="range" min="0" max="100" data-s="sfx"><b></b></label>
      <label class="set-row"><span>배경음악</span><input type="range" min="0" max="100" data-s="bgm"><b></b></label>
      <div class="p-toggles">
        <button data-s="mute"><img loading="lazy" src="assets/img/ui/note.png" alt="">소리 끄기</button>
        <button data-s="vib"><svg viewBox="0 0 24 24" width="22" height="22"><rect x="8" y="3" width="8" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M4 8v8M20 8v8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>진동</button>
      </div>
      <div class="set-label">테마 색 <small>가진 친구 색으로 바꿀 수 있어요</small></div>
      <div class="theme-dots" data-s="theme"></div>
      <div class="p-toggles p-toggles3">
        <button data-s="light">연출 가볍게</button>
        <button data-s="shake">화면 흔들림</button>
        <button data-s="fast">빠른 진행</button>
        <button data-s="skillfx">스킬 연출</button>
      </div>
      <button data-s="feedback" class="p-reset p-credits">의견 보내기</button>
      <button data-s="install" class="p-reset p-credits">앱처럼 쓰기 (홈 화면에 추가)</button>
      <button data-s="credits" class="p-reset p-credits">만든 사람·출처</button>
      <button data-s="reset" class="p-reset">게임 초기화</button>
      <div class="modal-btns"><button data-s="close" class="big-btn">닫기</button></div>
    </div>
  </div>

  <div id="charSheet" class="overlay"><div class="sheet-card"></div></div>

  <div id="modal" class="overlay">
    <div class="modal-card">
      <h2 id="modalTitle"></h2>
      <div id="modalStars" class="stars"></div>
      <button id="modalShare" class="share-btn" hidden>자랑하기</button>
      <img loading="lazy" id="modalChar" alt="">
      <p id="modalText"></p>
      <div id="modalRows" class="modal-rows"></div>
      <div class="modal-btns">
        <button id="modalBtn2" class="big-btn ghost"></button>
        <button id="modalBtn1" class="big-btn"></button>
      </div>
    </div>
  </div>

  <div id="fx"></div>
  <div id="flash"></div>
</div>
<script>
// 게임 스크립트보다 먼저: 나는 에러를 모아 뒀다가 guard.js가 서버로 보냄
window.__errs = [];
addEventListener('error', e => window.__errs.push(['error', e.message, (e.filename || '') + ':' + e.lineno + ':' + e.colno + '\n' + (e.error?.stack || '')]));
addEventListener('unhandledrejection', e => window.__errs.push(['promise', String(e.reason?.message || e.reason), e.reason?.stack || '']));
</script>
<script src="js/data.js?v=51"></script>
<script src="js/audio.js?v=32"></script>
<script src="js/board.js?v=33"></script>
<script src="js/particles.js?v=3"></script>
<script src="js/prefs.js?v=7"></script>
<script src="js/game.js?v=105"></script>
<script src="js/debuff.js?v=3"></script>
<script src="js/life.js?v=64"></script>
<script src="js/chapters.js?v=3"></script>
<script src="js/tutor.js?v=49"></script>
<script src="js/meta.js?v=55"></script>
<script src="js/firebase-config.js?v=29"></script>
<script src="js/net.js?v=41"></script>
<script src="js/daily.js?v=7"></script>
<script src="js/achieve.js?v=3"></script>
<script src="js/modes.js?v=5"></script>
<script src="js/aff.js?v=4"></script>
<script src="js/guard.js?v=3"></script>
<script src="js/survey.js?v=4"></script>
<script src="js/notice.js?v=6"></script>
<script src="js/stats.js?v=3"></script>
<script src="js/share.js?v=1"></script>
<script src="js/league.js?v=1"></script>
<script src="js/credits.js?v=1"></script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
