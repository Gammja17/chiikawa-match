<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>치이카와 토벌 퍼즐 (팬게임)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Baloo+2:wght@700;800&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=11">
</head>
<body>
<div id="app">

  <section id="title" class="screen active">
    <div class="title-sky">
      <h1>치이카와<br><span>토벌 퍼즐</span></h1>
      <div id="titleParty" class="title-party"></div>
      <button id="btnStart" class="big-btn">토벌 시작!</button>
      <p class="credit">비공식 팬게임 · 캐릭터 © nagano / chiikawa committee<br>이미지 출처 Chiikawa Wiki · 효과음 Kenney (CC0)</p>
    </div>
  </section>

  <section id="map" class="screen">
    <header class="bar">
      <button class="icon-btn" id="btnMapHome">⌂</button>
      <div class="bar-title" id="mapTitle">토벌 지도</div>
      <button class="icon-btn btn-mute">♪</button>
    </header>
    <div class="map-tabs"><button data-m="battle">⚔️ 토벌</button><button data-m="life">🌿 일상</button></div>
    <div id="mapScroll"><div id="mapPath"></div></div>
    <button id="btnRamen" class="ramen-btn"><img src="assets/img/npc/armor.png" alt=""><span>라면 가게</span><i class="dot"></i></button>
  </section>

  <section id="formation" class="screen">
    <header class="bar">
      <button class="icon-btn" id="btnFormBack">◀</button>
      <div class="bar-title">토벌대 편성<small id="formStage"></small></div>
      <button class="icon-btn btn-mute">♪</button>
    </header>
    <div class="form-body">
      <div class="form-card">
        <div class="form-label">이번 적</div>
        <div id="formEnemies" class="form-enemies"></div>
        <div class="attr-rule">💪씩씩 → 🌀엉뚱 → 💧울보 → 💪씩씩 <small>(화살표 쪽에 1.5배)</small></div>
      </div>
      <div class="form-card">
        <div class="form-label">출격 멤버 <span id="formCount"></span></div>
        <div id="formSlots" class="form-slots"></div>
      </div>
      <div id="formRoster" class="form-roster"></div>
    </div>
    <div class="form-foot"><button id="btnSortie" class="big-btn">출격!</button></div>
  </section>

  <section id="battle" class="screen">
    <header class="bar">
      <button class="icon-btn" id="btnBack">◀</button>
      <div class="bar-title"><span id="stageName"></span><small id="waveInfo"></small></div>
      <button class="icon-btn btn-mute">♪</button>
    </header>
    <div id="arena">
      <div id="feverTag">응원 피버! ×1.5</div>
      <div id="monsterWrap">
        <div id="monName"></div>
        <div id="monHp" class="hp"><div class="fill"></div><span></span></div>
        <div id="monSprite"><img id="monster" alt=""></div>
        <div id="countdown"></div>
      </div>
    </div>
    <div id="team">
      <div id="party"></div>
      <div id="teamHp" class="hp"><div class="fill"></div><span></span></div>
    </div>
    <div id="lifeHud">
      <div class="lh-card lh-limit"><small id="lhLimitLabel">남은 이동</small><b id="lhLimit">0</b></div>
      <div class="lh-card lh-goals"><small>목표</small><div id="lhGoals"></div></div>
      <img id="lhChar" alt="">
    </div>
    <div id="lhScore"><div class="bar"><div class="fill"></div><i></i><i></i><i></i></div><b>0</b></div>
    <div id="boardWrap"><div id="board"></div></div>
  </section>

  <div id="story" class="overlay">
    <div class="story-box">
      <img id="storyChar" alt="">
      <div class="story-text">
        <div id="storyName"></div>
        <div id="storyLine"></div>
        <div class="story-next">▼</div>
      </div>
    </div>
  </div>

  <div id="modal" class="overlay">
    <div class="modal-card">
      <h2 id="modalTitle"></h2>
      <div id="modalStars" class="stars"></div>
      <img id="modalChar" alt="">
      <p id="modalText"></p>
      <div id="modalRows" class="modal-rows"></div>
      <div class="modal-btns">
        <button id="modalBtn2" class="big-btn ghost"></button>
        <button id="modalBtn1" class="big-btn"></button>
      </div>
    </div>
  </div>

  <div id="fx"></div>
  <div id="flash"></div>
</div>
<script src="js/data.js?v=11"></script>
<script src="js/audio.js?v=11"></script>
<script src="js/board.js?v=11"></script>
<script src="js/game.js?v=11"></script>
<script src="js/life.js?v=11"></script>
</body>
</html>
